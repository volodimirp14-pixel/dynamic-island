name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Check icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($exe in @('build/Release/DynamicIsland.exe', 'build/Release/DynamicIslandLauncher.exe')) {
            $bmp = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe)).ToBitmap()
            $p = $bmp.GetPixel([int]($bmp.Width * 186 / 256), [int]($bmp.Height * 128 / 256))
            Write-Host "$exe icon dot: R=$($p.R) G=$($p.G) B=$($p.B) A=$($p.A)"
            if (-not ($p.G -gt $p.R + 60)) { throw "icon dot is not green" }
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: DynamicIsland-${{ github.sha }}
          path: build/Release/*.exe
          if-no-files-found: error
