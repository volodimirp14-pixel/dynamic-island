name: release

# Publishing a version: raise the version in src/common/Version.h and push to main.
# If there is no GitHub Release v<version> yet, this builds, packs
# DynamicIsland-<version>-win-x64.zip, creates the tag and the Release, and
# (optional) uploads the same zip to itch.io. Versions with a "-" (e.g. 1.1.0-beta)
# are not published automatically. "Run workflow" re-publishes the current version.
# itch.io upload runs only when the repository has the secret BUTLER_API_KEY and
# the variable ITCH_TARGET (e.g. "username/dynamic-island:windows").
on:
  push:
    branches: [main]
    paths: ["src/common/Version.h", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*DI_VERSION_STRING_A "\([^"]*\)".*/\1/p' src/common/Version.h)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-* ]]; then
            echo "::notice::$VERSION is a pre-release version; not published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Pack
        shell: pwsh
        run: |
          $name = "DynamicIsland-${{ needs.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Force "pack/$name" | Out-Null
          Copy-Item build/Release/DynamicIsland.exe, build/Release/DynamicIslandLauncher.exe "pack/$name/"
          Copy-Item dist/README-ru.txt "pack/$name/README-ru.txt"
          Compress-Archive -Path "pack/$name/*" -DestinationPath "pack/$name.zip"
          (Get-FileHash "pack/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "pack/$name.zip.sha256"
          Get-Content "pack/$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: pack/*.zip*
          if-no-files-found: error

  github:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: pack
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pack/* --clobber
          else
            gh release create "$TAG" pack/* --target "${{ github.sha }}" --title "Dynamic Island ${{ needs.version.outputs.version }}" --notes-file docs/RELEASE_NOTES.md --latest
          fi

  itch:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: pack
      - name: Upload to itch.io
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::notice title=itch.io skipped::Add secret BUTLER_API_KEY and variable ITCH_TARGET to upload automatically."
            exit 0
          fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push pack/DynamicIsland-${{ needs.version.outputs.version }}-win-x64.zip "$ITCH_TARGET" --userversion "${{ needs.version.outputs.version }}"
